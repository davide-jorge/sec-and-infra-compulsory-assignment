name: authorization-compose

services:
  web:
    build: ./client
    environment:
      PORT: "3000"
    ports:
      - "8080:3000"
    restart: unless-stopped

  api:
    build: ./server
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
    volumes:
      - api-data:/app/data
    ports:
      -  "8081:4000"
    restart: unless-stopped

volumes:
  api-data: